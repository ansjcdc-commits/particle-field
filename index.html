<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Particle Field — Hand Interaction</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="stage" aria-label="Interactive particle field">
    <div class="topline">
      <div class="brand"><strong>PARTICLE FIELD</strong><span>HAND INTERACTION</span></div>
      <div class="controls"><span id="tracking" class="tracking"><i></i> HAND TRACKING OFF</span><button id="cameraButton" type="button">ENABLE CAMERA</button><button id="debugButton" type="button" aria-pressed="false">DEBUG</button></div>
    </div>
    <section id="debugPanel" class="debug" hidden></section>
    <div class="gesture" id="gestureLabel">MOVE YOUR HAND TO INTERACT</div>
    <div class="camera-wrap" id="cameraWrap" hidden><video id="camera" playsinline muted></video><canvas id="landmarks"></canvas></div>
    <div class="camera-error" id="cameraError" hidden></div>
  </main>
  <script type="module" src="./main.js?v=ansj-gesture-20260928-2"></script>
</body>
</html>
